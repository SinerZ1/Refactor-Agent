[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor-agent-backend"
version = "0.1.0"
description = "FastAPI 与 LangGraph 驱动的多智能体代码重构后端"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.139,<1",
    "uvicorn[standard]>=0.50,<1",
    "langgraph>=1.2,<2",
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.3,<2",
    "langchain-google-genai>=4.2,<5",
    "google-genai>=2.10,<3",
    "langgraph-checkpoint-redis>=0.5,<1",
    "redis>=7.4,<8",
    "neo4j>=6.2,<7",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28,<1",
    "pywebview>=6.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7,<8",
    "mypy>=2.2,<3",
    "ruff>=0.15,<1",
    "black>=26.5,<27",
    "isort>=8,<9",
    "vulture>=2.16,<3",
]

[project.scripts]
format = "scripts:format"
sort-imports = "scripts:sort_imports"
check-format = "scripts:check_format"
check-sort-imports = "scripts:check_sort_imports"
check-mypy = "scripts:check_mypy"
check-lint = "scripts:check_lint"
find-dead-code = "scripts:find_dead_code"
test = "scripts:test"
test-verbose = "scripts:test_verbose"
test-coverage = "scripts:test_coverage"

[tool.setuptools]
packages = ["agent", "evals", "scripts"]
py-modules = [
    "agent_core",
    "app",
    "code_indexer",
    "graph_indexer",
    "main_gui",
    "model_catalog",
    "session_registry",
]

[tool.setuptools.package-data]
evals = ["README.md", "baselines/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "behavior_tests"]
cache_dir = ".cache/pytest"
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.12"
cache_dir = ".cache/mypy"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["venv", "\\.cache"]

[tool.black]
target-version = ["py312"]
extend-exclude = '''
/(
    venv
  | \.cache
  | \.pytest_cache
  | \.pytest_tmp
)/
'''

[tool.isort]
profile = "black"
py_version = 312
skip_glob = ["venv/*", ".cache/*", ".pytest_cache/*", ".pytest_tmp/*"]

[tool.ruff]
target-version = "py312"
exclude = ["venv", ".cache", ".pytest_cache", ".pytest_tmp"]

[tool.coverage.run]
source = [
    "agent",
    "app",
    "code_indexer",
    "graph_indexer",
    "model_catalog",
    "session_registry",
]
omit = ["tests/*", "behavior_tests/*", "venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
