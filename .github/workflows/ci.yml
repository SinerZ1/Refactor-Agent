name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Windows · Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
        working-directory: backend
    env:
      REDIS_URL: ""
      NEO4J_URI: ""
      NEO4J_USER: ""
      NEO4J_PASSWORD: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      VERTEX_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install backend dependencies
        run: .\venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Verify Redis and Neo4j degradation
        run: >-
          .\venv\Scripts\python.exe -m pytest
          tests/test_app_transport.py::test_get_checkpointer_no_redis_url
          tests/test_backend_contracts.py::test_neo4j_missing_credentials_skips_driver_and_uses_ast
          tests/test_backend_contracts.py::test_health_reports_optional_component_degradation_without_failing

      - name: Black
        run: .\venv\Scripts\check-format.exe

      - name: isort
        run: .\venv\Scripts\check-sort-imports.exe

      - name: mypy
        run: .\venv\Scripts\check-mypy.exe

      - name: Ruff
        run: .\venv\Scripts\check-lint.exe

      - name: Unit and trusted behavior tests with coverage
        run: .\venv\Scripts\test-coverage.exe

      - name: Offline Agent eval
        run: .\venv\Scripts\python.exe -m evals.run --mode offline

  frontend:
    name: Frontend · Windows · Node 24
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
        working-directory: frontend
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm.cmd ci

      - name: Type check
        run: npm.cmd run type-check

      - name: Unit tests
        run: npm.cmd run test:unit -- --run

      - name: Production build
        run: npm.cmd run build

      - name: Install Chromium
        run: npx.cmd playwright install chromium

      - name: Chromium E2E
        run: npm.cmd run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
